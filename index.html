const short=d=>`${Number(d.slice(5,7))}.${Number(d.slice(8))}`,pretty=d=>`${Number(d.slice(5,7))}월 ${Number(d.slice(8))}일`,uid=()=>crypto.randomUUID?crypto.randomUUID().replace(/-/g,''):'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let db,lastRaw=null,blocked=false,undo=null,toastTimer;
const state={view:'today',date:C.localToday(),cadence:'weekly',domain:null,goal:null,statsMode:'week',expandedStats:{daily:true},statsDate:C.localToday(),statsGoal:null,detailPane:'calendar',edit:null};
function warn(message){const banner=$('#storage-warning');banner.hidden=false;banner.textContent=message;$('#save-status').textContent='저장 확인 필요';}
try{lastRaw=localStorage.getItem(KEY);db=lastRaw?C.validateDB(JSON.parse(lastRaw)):C.createDB();if(!lastRaw){lastRaw=JSON.stringify(db);localStorage.setItem(KEY,lastRaw);}}
catch(error){db=C.createDB();blocked=true;warn('이 브라우저의 기록을 불러오거나 저장하지 못했어요. 설정에서 백업을 확인한 뒤 다시 열어 주세요.');}
function persist(next){if(blocked)throw Error('저장 공간을 사용할 수 없어요. 설정에서 백업한 뒤 다른 브라우저로 열어 주세요.');if(localStorage.getItem(KEY)!==lastRaw)throw Error('다른 창에서 기록이 바뀌었어요. 이 페이지를 새로 열어 주세요.');const clean=C.validateDB(next);clean.updatedAt=new Date().toISOString();const raw=JSON.stringify(clean);localStorage.setItem(KEY,raw);lastRaw=raw;db=clean;$('#save-status').textContent='이 기기에 저장됨';return clean;}
function commit(fn,message='저장했어요.',allowUndo=true){const before=JSON.stringify(db),next=JSON.parse(before);try{fn(next);persist(next);if(allowUndo)undo=before;render(false);if(message)notify(message,allowUndo);return true;}catch(error){const msg=error.name==='QuotaExceededError'?'저장 공간이 부족해요. 백업을 먼저 내려받아 주세요.':error.message;notify(msg,false);const errorBox=$('#form-error',modalContent);if(errorBox){errorBox.hidden=false;errorBox.textContent=msg;}return false;}}
function notify(message,withUndo=false){clearTimeout(toastTimer);toast.innerHTML=`<span>${esc(message)}</span>${withUndo?'<button data-action="undo">취소</button>':''}`;toast.hidden=false;toastTimer=setTimeout(()=>toast.hidden=true,withUndo?7000:5000);}
const goal=id=>db.goals.find(g=>g.id===id);
const active=g=>!g.archivedAt||g.archivedAt>state.date;
const habitList=c=>db.goals.filter(g=>g.kind==='habit'&&active(g)&&(!c||g.cadence===c));
function heading(title,sub=''){return `<div class="pagehead">${sub?`<p class="eyebrow">${esc(sub)}</p>`:''}<h1>${esc(title)}</h1></div>`;}
function datebar(kind,date){return `<div class="datebar"><button data-date-step="-1" data-date-kind="${kind}" aria-label="이전 ${kind==='stats'?'기간':'날짜'}">‹</button><input type="date" data-date="${kind}" aria-label="${kind==='stats'?'통계 기준 날짜':'기록 날짜'}" value="${date}" min="2000-01-01" max="${C.localToday()}"><button data-date-step="1" data-date-kind="${kind}" aria-label="다음 ${kind==='stats'?'기간':'날짜'}" ${date>=C.localToday()?'disabled':''}>›</button></div>`;}
function empty(title,body){return `<div class="empty"><strong>${esc(title)}</strong>${esc(body)}</div>`;}
function summaryValue(g,date){const p=C.progress(db,g,date);return p.value===null?'미기록':`${p.value.toLocaleString('ko-KR')}${esc(g.unit)}`;}
function habitRow(g,date=state.date){const p=C.progress(db,g,date),quick=g.cadence==='daily',glyph=icon(g.id==='d5-1'?'book':g.id==='d5-7'?'language':g.id==='d5-4'?'moon':'check');return `<article class="row"><span class="bubble" aria-hidden="true">${glyph}</span><button class="row-copy" data-record="${g.id}" data-record-date="${date}" aria-label="${esc(g.title)} 기록 수정"><strong>${esc(g.title)}${p.done?' <span class="text-blue">✓</span>':''}</strong><div class="row-value${p.value===null?' is-empty':''}">${summaryValue(g,date)} <small>/ ${g.mode==='atmost'?'최대 ':''}${p.target}${esc(g.unit)}</small></div>${g.mode==='atmost'?`<small>${p.value===null?'0회도 직접 기록해 주세요.':p.done?'상한 이내':'상한을 넘었어요.'}</small>`:''}</button><button class="row-action ${p.done?'done':''}" ${g.mode==='atmost'||p.done||g.id==='d5-4'||!quick?`data-record="${g.id}" data-record-date="${date}"`:`data-complete="${g.id}" data-record-date="${date}"`}>${g.mode==='atmost'||g.id==='d5-4'||!quick?'기록':p.done?'수정':'완료'}</button></article>`;}
function todayView(){const daily=habitList('daily').sort((a,b)=>['d5-1','d5-7','d5-4'].indexOf(a.id)-['d5-1','d5-7','d5-4'].indexOf(b.id)),done=daily.filter(g=>C.progress(db,g,state.date).done).length,pinned=habitList().filter(g=>g.pinned&&g.cadence!=='daily').slice(0,3),tasks=db.goals.filter(g=>g.kind==='project'&&active(g)&&g.status!=='done'&&g.nextAction).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,3);return heading(state.date===C.localToday()?'오늘의 목표':'이날의 기록',new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long',timeZone:'UTC'}).format(C.parse(state.date)))+datebar('record',state.date)+`<section class="card"><div class="card-head"><h2>매일의 루틴</h2><span class="pill">${done} / ${daily.length} 완료</span></div><div class="progress" role="progressbar" aria-label="일간 루틴 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${daily.length?Math.round(done/daily.length*100):0}"><span style="width:${daily.length?done/daily.length*100:0}%"></span></div>${daily.map(g=>habitRow(g)).join('')||empty('등록된 일간 목표가 없어요.','목표 탭에서 추가할 수 있어요.')}</section><section class="card"><div class="card-head"><h2>이번 주에 이어갈 일</h2><button class="text-button" data-action="pins">선택</button></div>${pinned.map(g=>habitRow(g)).join('')||empty('오늘 볼 목표를 골라보세요.','최대 3개까지 올릴 수 있어요.')}</section>${tasks.length?`<section class="card"><div class="card-head"><h2>다음 행동</h2></div>${tasks.map(g=>`<button class="stats-row" data-goal="${g.id}"><span class="row-copy"><strong>${esc(g.nextAction)}</strong><small>${esc(g.title)}${g.due?' · '+pretty(g.due)+'까지':''}</small></span><span class="chevron">›</span></button>`).join('')}</section>`:''}`;}
function periodView(){return heading('주기별 트래커','정해둔 주기에 맞춰 차근차근')+`<label class="form-field" style="margin:0 0 12px">주기<select id="cadence">${C.CYCLES.map(c=>`<option value="${c}" ${state.cadence===c?'selected':''}>${C.LABELS[c]}</option>`).join('')}</select></label>`+datebar('record',state.date)+`<p class="note">${short(C.bounds(state.cadence,state.date).start)} — ${short(C.bounds(state.cadence,state.date).end)}의 누적 기록</p><section class="card">${habitList(state.cadence).map(g=>habitRow(g)).join('')||empty('이 주기의 목표가 없어요.','목표 탭에서 새 목표를 추가하세요.')}</section>`;}
function goalsView(){if(state.goal)return goalDetailView(goal(state.goal));if(state.domain!==null)return domainView();return heading('나의 목표','8개 영역에서 쌓는 나의 방향')+`<section class="card hero"><p class="small">큰 목표</p><h2>${esc(db.northstar.title)}</h2><p class="small">${db.northstar.due.replaceAll('-','.')}까지</p></section><div class="grid2">${C.SEED.map((d,i)=>`<button data-domain="${i}"><span class="text-blue" aria-hidden="true">${['◎','↗','▤','⌕','♧','◌','₩','♡'][i]}</span><strong>${esc(d.name)}</strong><small>${db.goals.filter(g=>g.domain===d.name&&!g.archivedAt).length}개 목표</small></button>`).join('')}</div><button class="secondary" data-action="add-goal">새 목표 추가</button><button class="text-button" data-action="archived">보관한 목표</button>`;}
function domainView(){const d=C.SEED[state.domain],items=db.goals.filter(g=>g.domain===d.name&&!g.archivedAt);return `<button class="back" data-action="back-goals">‹ 전체 목표</button>`+heading(d.name,d.sub)+`<section class="card">${items.map(g=>`<button class="stats-row" data-goal="${g.id}"><span class="row-copy"><strong>${esc(g.title)}</strong><small>${g.kind==='habit'?C.LABELS[g.cadence]+' · '+summaryValue(g,state.date):({notstarted:'시작 전',active:'진행 중',done:'완료'}[g.status])}</small></span><span class="chevron">›</span></button>`).join('')}</section>`;}
function statsControls(){return `<div class="tabs" aria-label="통계 기간">${[['week','주간'],['month','월간']].map(([id,t])=>`<button data-stats-mode="${id}" aria-pressed="${state.statsMode===id}">${t}</button>`).join('')}</div>`+datebar('stats',state.statsDate);}
function reportMetric(g,p){const m=C.metric(db,g,p.start,p.end);if(g.mode!=='atmost'&&m.total===1&&((g.cadence==='weekly'&&state.statsMode==='week')||(g.cadence==='monthly'&&state.statsMode==='month'))){const r=m.slots[0];m.amount=r;m.rate=r.value===null?null:Math.min(100,Math.round(100*r.value/r.target));}return m;}
function metricText(m,g){if(m.amount)return m.amount.value===null?'미기록':`${m.amount.value} / ${m.amount.target}${g.unit}`;const u=g.cadence==='daily'?'일':g.cadence==='weekly'?'주':'기간';return m.total?`${m.done} / ${m.total}${u} ${g.mode==='atmost'?'준수':'달성'}${m.missing?' · 미기록 '+m.missing+u:''}`:'아직 마감된 기간이 없어요.';}
function statsView(){if(state.statsGoal)return statsDetailView(goal(state.statsGoal));const p=C.bounds(state.statsMode==='week'?'weekly':'monthly',state.statsDate);return heading('쌓여가는 나의 기록')+statsControls()+`<p class="note">${short(p.start)} — ${short(p.end)} · 마감된 예정 기간 기준</p>`+C.CYCLES.map(c=>{const list=db.goals.filter(g=>g.kind==='habit'&&g.cadence===c&&g.start<=p.end&&(!g.archivedAt||g.archivedAt>p.start));return list.length?`<details class="card stats-group" data-stats-cadence="${c}" ${state.expandedStats[c]?'open':''}><summary>${C.LABELS[c]} 목표 <span class="small">${list.length}개</span></summary>${list.map(g=>{const m=reportMetric(g,p),pr=C.progress(db,g,state.statsDate);return `<button class="stats-row" data-stats-goal="${g.id}"><span class="row-copy"><strong>${esc(g.title)}</strong><small>${esc(metricText(m,g))}</small>${pr.end>=C.localToday()&&pr.start<=C.localToday()?`<small>현재 기간: ${summaryValue(g,state.statsDate)} / ${pr.target}${esc(g.unit)}</small>`:''}</span><span class="rate">${m.rate===null?'—':m.rate+'%'}</span><span class="chevron">›</span></button>`;}).join('')}</details>`:'';}).join('')+`<p class="note">오늘과 아직 끝나지 않은 주기는 별도로 보여요. 미기록도 예정 기간에 포함해, 기록으로 확인된 달성률을 계산해요. 주간 목표는 일요일이 속한 달로 집계해요.</p>`;}
function statsDetailView(g){const p=C.bounds(state.statsMode==='week'?'weekly':'monthly',state.statsDate),m=reportMetric(g,p),before=C.bounds(state.statsMode==='week'?'weekly':'monthly',C.add(p.start,-1)),prev=reportMetric(g,before),closed=p.end<C.localToday(),diff=closed&&m.rate!==null&&prev.rate!==null?m.rate-prev.rate:null,current=C.progress(db,g,C.localToday());let content='';
 if(state.detailPane==='trend'){const periods=[];let period=p;for(let i=0;i<4;i++){periods.unshift(period);period=C.bounds(state.statsMode==='week'?'weekly':'monthly',C.add(period.start,-1));}content=`<section class="card"><h2>최근 ${state.statsMode==='week'?'4주':'4개월'} 추이</h2>${periods.map(r=>{const q=reportMetric(g,r);return `<div class="trend-row"><span>${state.statsMode==='week'?short(r.start)+'–'+short(r.end):r.start.slice(0,7).replace('-','.')} ${r.end>=C.localToday()?'*':''}</span><div class="progress" aria-hidden="true"><span style="width:${q.rate||0}%"></span></div><strong>${q.rate===null?'—':q.rate+'%'}</strong></div>`;}).join('')}<p class="note">* 진행 중인 기간은 마감된 부분만 집계해요.</p></section>`;}
 else if(g.cadence==='daily'){const offset=(C.parse(p.start).getUTCDay()+6)%7;content=`<section class="card"><h2>날짜별 기록</h2><p class="small">날짜를 눌러 기록을 확인하거나 수정하세요.</p><div class="calendar">${['월','화','수','목','금','토','일'].map(d=>`<span class="weekday">${d}</span>`).join('')}${C.dates(p.start,p.end).map((d,i)=>{const v=C.valueAt(db,g,d),done=C.isDone(g,v,d),status=v===null?'미기록':done?'달성':'기준 미만';return `<button class="${v===null?'unrecorded':done?'achieved':'below'} ${d===C.localToday()?'current':''}" ${i===0?`style="grid-column-start:${offset+1}"`:''} data-record="${g.id}" data-record-date="${d}" aria-label="${pretty(d)} ${d>C.localToday()?'아직 오지 않은 날짜':status+(v===null?'':' '+v+esc(g.unit))}" ${d>C.localToday()?'disabled':''}><span>${Number(d.slice(8))}</span><small aria-hidden="true">${d>C.localToday()?'':v===null?'—':done?'✓':'·'}</small></button>`;}).join('')}</div><div class="legend"><span>✓ 달성</span><span>· 기준 미만</span><span>— 미기록</span></div></section>`;}
 else{let span=C.bounds(g.cadence,p.start),slots=[];while(span.start<=p.end){if(span.start<=C.localToday()&&span.end>=g.start&&(!g.archivedAt||span.start<g.archivedAt))slots.push(span);span=C.bounds(g.cadence,C.add(span.end,1));}content=`<section class="card"><h2>기간별 기록</h2>${slots.map(r=>{const v=C.valueAt(db,g,r.start),date=r.start>C.localToday()?C.localToday():r.start;return `<button class="stats-row" data-record="${g.id}" data-record-date="${date}"><span class="row-copy"><strong>${short(r.start)} — ${short(r.end)}</strong><small>${r.end>=C.localToday()?'진행 중':C.isDone(g,v,r.start)?g.mode==='atmost'?'상한 준수':'달성':v===null?'미기록':'기준 미만'}</small></span><span>${v===null?'—':v+esc(g.unit)}</span><span class="chevron">›</span></button>`;}).join('')||empty('기록할 기간이 없어요.','목표를 시작한 이후의 날짜를 선택하세요.')}</section>`;}
 return `<button class="back" data-action="back-stats">‹ 항목별 통계</button>`+heading(g.title,g.domain)+statsControls()+`<section class="card"><p class="small">${g.mode==='atmost'?'상한 준수율':'목표 달성률'}</p><div class="big">${m.rate===null?'—':m.rate+'%'}</div><p>${esc(metricText(m,g))}</p>${diff!==null?`<p class="note text-blue">${diff===0?'이전 기간과 같아요.':'이전 기간보다 '+Math.abs(diff)+'%p '+(diff>0?'높아요.':'낮아요.')}</p>`:''}${current.start<=p.end&&current.end>=p.start?`<p class="note">진행 중: ${summaryValue(g,C.localToday())} / ${current.target}${esc(g.unit)}</p>`:''}</section><div class="tabs" aria-label="상세 통계 보기"><button data-detail-pane="calendar" aria-pressed="${state.detailPane==='calendar'}">기록</button><button data-detail-pane="trend" aria-pressed="${state.detailPane==='trend'}">추이</button></div>`+content+`<p class="note">${m.amount?"실제 기록량을 목표량으로 나눈 비율이며, 100%까지 표시해요.":"마감된 예정 기간 중 목표를 지킨 비율이에요."} 미래와 시작 전 날짜는 제외하고, 미기록은 구분해서 표시해요. ${g.cadence!=='daily'?'기간이 끝난 날짜를 기준으로 집계해요.':''}</p>`;
}
function render(scroll=true){document.documentElement.style.colorScheme=db.settings.theme==='system'?'light dark':db.settings.theme;main.innerHTML=({today:todayView,period:periodView,stats:statsView,goals:goalsView}[state.view]||todayView)();document.querySelectorAll('.bottom-nav button').forEach(b=>{if(b.dataset.nav===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function showModal(title,body){modalContent.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button data-action="close-modal" aria-label="닫기">×</button></div>${body}<p id="form-error" class="error" role="alert" hidden></p>`;if(!modal.open)modal.showModal();}
function recordModal(id,date=state.date){const g=goal(id),p=C.progress(db,g,date),record=db.records[C.recKey(g,date)],presets=g.id==='d5-4'?[6,7,8]:g.unit==='쪽'?[30,60,p.target]:g.unit==='분'?[15,30,p.target]:[0,1,p.target];state.edit={id,date};showModal(g.title,`<p class="note">${g.cadence==='daily'?pretty(date):short(p.start)+' — '+short(p.end)}의 ${g.cadence==='daily'?'기록':'누적 기록'}</p><form id="record-form"><label class="form-field">${g.mode==='atmost'?'실제 횟수':g.cadence==='daily'?'기록한 양':'이 기간의 전체 횟수'} (${esc(g.unit)})<input name="value" type="number" min="0" ${g.id==='d5-4'?'max="24"':'max="1000000000"'} step="${['회','건','편','명','쪽'].includes(g.unit)?'1':'any'}" inputmode="${['시간','억','개월'].includes(g.unit)?'decimal':'numeric'}" value="${p.value??''}" placeholder="미기록"></label><div class="presets">${[...new Set(presets)].map(n=>`<button type="button" data-preset="${n}">${n}${esc(g.unit)}</button>`).join('')}</div><label class="form-field">메모 <span class="small">선택</span><textarea name="note" maxlength="2000" placeholder="기록에 남기고 싶은 내용">${esc(record?.note||'')}</textarea></label><button class="primary" type="submit">기록 저장</button><p class="note">숫자를 비우면 미기록으로 바뀌어요.${g.mode==='atmost'?' 하지 않은 기간은 0으로 기록해 주세요.':''}</p></form>`);}
function settingsModal(){showModal('설정과 백업',`<p class="note">기록은 이 기기의 현재 브라우저에 저장돼요. 다른 기기와 자동으로 공유되지 않아요. 브라우저 데이터를 지우기 전에 백업해 주세요.</p><div class="settings-row"><label for="theme">화면 모드</label><select id="theme">${[['system','기기 설정'],['light','밝게'],['dark','어둡게']].map(([v,l])=>`<option value="${v}" ${db.settings.theme===v?'selected':''}>${l}</option>`).join('')}</select></div><button class="primary" data-action="export">백업 파일 내려받기</button><button class="secondary" data-action="import">백업에서 복원</button><button class="text-button" data-action="recover-previous">직전 복원 되돌리기</button><p class="note">복원 전 내용을 확인할 수 있어요. 파일을 새 위치로 옮기거나 다른 브라우저로 열면 저장 공간이 달라질 수 있어요.</p><div class="divider"></div><p class="small">방향 1.0 · ${db.goals.length}개 목표 · ${Object.keys(db.records).length}개 기록<br>토스 스타일의 인터페이스 · Pretendard 서체 사용</p>`);}
function exportBackup(data=db){if(blocked&&lastRaw)data=lastRaw;const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='방향-백업-'+C.localToday()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('백업 파일을 내려받았어요.');}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.nav){state.view=d.nav;if(d.nav==='today')state.date=C.localToday();state.goal=null;state.domain=null;state.statsGoal=null;toast.hidden=true;render();}else if(d.record){recordModal(d.record,d.recordDate);}else if(d.complete){const g=goal(d.complete),date=d.recordDate||state.date;commit(next=>C.putRecord(next,g.id,date,C.targetAt(g,C.bounds(g.cadence,date).start)),'목표만큼 기록했어요.');}else if(d.preset!==undefined){$('#record-form [name=value]').value=d.preset;}else if(d.domain){state.domain=Number(d.domain);state.goal=null;render();}else if(d.goal){state.goal=d.goal;state.view='goals';render();}else if(d.statsMode){state.statsMode=d.statsMode;render();}else if(d.statsGoal){state.statsGoal=d.statsGoal;render();}else if(d.dateStep){const k=d.dateKind==='stats'?'statsDate':'date',cad=d.dateKind==='stats'?(state.statsMode==='week'?'weekly':'monthly'):state.view==='period'?state.cadence:'daily',p=C.bounds(cad,state[k]);state[k]=d.dateStep==='-1'?C.add(p.start,-1):C.add(p.end,1);if(state[k]>C.localToday())state[k]=C.localToday();render();}else if(d.action){handleAction(d.action,b);}});
function handleAction(action,b){if(action==='close-modal')modal.close();else if(action==='settings'){settingsModal();}else if(action==='export')exportBackup();else if(action==='import')$('#backup-input').click();else if(action==='undo'&&undo){try{const before=JSON.parse(undo);persist(before);undo=null;render(false);notify('방금 변경을 취소했어요.');}catch(e){notify(e.message);}}else if(action==='back-goals'){state.goal=null;state.domain=null;render();}else extraAction(action,b);}
document.addEventListener('submit',e=>{if(e.target.id==='record-form'){e.preventDefault();const f=e.target,v=f.elements.value.value===''?null:Number(f.elements.value.value),edit={...state.edit};if(commit(next=>C.putRecord(next,edit.id,edit.date,v,f.elements.note.value),'기록을 저장했어요.'))modal.close();}else extraSubmit(e);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.date){const k=el.dataset.date==='stats'?'statsDate':'date';if(C.validDate(el.value)&&el.value<=C.localToday())state[k]=el.value;render();}else if(el.id==='cadence'){state.cadence=el.value;render();}else if(el.id==='theme'){commit(next=>next.settings.theme=el.value,'화면 모드를 바꿨어요.',false);}else extraChange(e);});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});
document.addEventListener('toggle',e=>{if(e.target.matches('details[data-stats-cadence]')&&e.target.isConnected)state.expandedStats[e.target.dataset.statsCadence]=e.target.open;},true);
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue!==lastRaw){warn('다른 창에서 기록이 변경됐어요. 입력 중인 내용을 확인하고 이 페이지를 새로 열어 주세요.');}});
function goalDetailView(g){if(!g)return empty('목표를 찾을 수 없어요.','전체 목표에서 다시 선택하세요.');const future=g.revisions.filter(r=>r.from>C.localToday());return `<button class="back" data-action="back-domain">‹ ${esc(g.domain)}</button>`+heading(g.title,g.kind==='habit'?C.LABELS[g.cadence]+' 반복 목표':'장기 목표 · 프로젝트')+`<section class="card"><p class="note">${esc(g.description.replace(/ · (현재값 미입력|기한 미설정|진행 상태 미입력)/g,''))}</p>${g.archivedAt?'<p class="pill">보관된 목표</p>':''}${g.kind==='habit'?habitRow(g,C.localToday()):`<p class="small">진행 상태</p><h2>${{notstarted:'시작 전',active:'진행 중',done:'완료'}[g.status]}</h2>${g.unit?`<div class="big">${g.current===null?'—':g.current}<small class="small"> / ${C.targetAt(g,C.localToday())}${esc(g.unit)}</small></div>`:''}`}${future.map(r=>`<p class="note">${pretty(r.from)}부터 목표 ${r.target}${esc(g.unit)} 적용 예정</p>`).join('')}</section>${g.kind==='habit'?`<button class="primary" data-open-stats="${g.id}">이 목표의 통계 보기</button><button class="secondary" data-edit-goal="${g.id}">이름·목표량 수정</button>`:projectFields(g)}<button class="text-button ${g.archivedAt?'':'text-danger'}" data-${g.archivedAt?'unarchive':'archive'}="${g.id}">${g.archivedAt?'보관 해제':'목표 보관하기'}</button>`;}
function projectFields(g){return `<form id="project-form" data-project="${g.id}" class="card"><h2>다음 행동</h2><label class="form-field">진행 상태<select name="status">${[['notstarted','시작 전'],['active','진행 중'],['done','완료']].map(([k,l])=>`<option value="${k}" ${g.status===k?'selected':''}>${l}</option>`).join('')}</select></label>${g.unit?`<div class="grid2"><label class="form-field">현재 (${esc(g.unit)})<input type="number" inputmode="decimal" name="current" min="0" max="1000000000000" step="any" value="${g.current??''}"></label><label class="form-field">목표 (${esc(g.unit)})<input type="number" name="target" inputmode="decimal" min="0.0001" max="1000000000000" step="any" value="${C.targetAt(g,C.localToday())}"></label></div>`:''}<label class="form-field">가장 먼저 할 일<input name="nextAction" maxlength="1000" value="${esc(g.nextAction)}" placeholder="예: 출자 후보 3명에게 미팅 제안"></label><label class="form-field">다음 행동 예정일<input type="date" name="due" min="2000-01-01" max="2099-12-31" value="${g.due}"></label><button class="primary" type="submit">다음 행동 저장</button></form><section class="card"><div class="card-head"><h2>진행 단계</h2><span class="small">${g.milestones.filter(m=>m.done).length} / ${g.milestones.length}</span></div>${g.milestones.map(m=>`<div class="task-row"><button class="check" data-milestone="${m.id}" data-parent="${g.id}" aria-label="${esc(m.title)} ${m.done?'완료 해제':'완료'}" aria-pressed="${m.done}">${m.done?'✓':'○'}</button><span class="row-copy ${m.done?'done-copy':''}">${esc(m.title)}</span><button class="icon-button" data-remove-milestone="${m.id}" data-parent="${g.id}" aria-label="${esc(m.title)} 단계 삭제">×</button></div>`).join('')||empty('단계를 정해보세요.','완료할 때마다 체크하며 진행을 확인할 수 있어요.')}<form id="milestone-form" data-project="${g.id}"><label class="form-field">새 단계<input name="title" maxlength="300" required placeholder="예: 규약 초안 작성"></label><button class="secondary" type="submit">단계 추가</button></form></section>`;}
function goalSettings(id){const g=goal(id),scheduled=g.revisions[g.revisions.length-1];state.edit={id};showModal('목표 설정',`<form id="goal-settings-form"><label class="form-field">목표 이름<input name="title" maxlength="200" required value="${esc(g.title)}"></label><label class="form-field">${C.LABELS[g.cadence]} 목표 (${esc(g.unit)})<input name="target" type="number" inputmode="decimal" min="0.0001" max="1000000000000" step="any" required value="${scheduled.target}"></label><p class="note">목표량 변경은 ${g.cadence==='daily'?'내일':'다음 '+C.LABELS[g.cadence]+' 기간'}부터 적용돼요. 과거 달성률은 당시 목표를 유지해요. 반복 주기나 단위를 바꾸려면 기존 목표를 보관하고 새 목표를 추가하세요.</p><button class="primary" type="submit">변경 저장</button></form>`);}
function addGoalModal(){showModal('새 목표 추가',`<form id="add-goal-form"><label class="form-field">목표 이름<input name="title" maxlength="200" required placeholder="어떤 목표를 추가할까요?"></label><label class="form-field">영역<select name="domain">${C.SEED.map(d=>`<option>${esc(d.name)}</option>`).join('')}</select></label><label class="form-field">유형<select name="kind" id="new-kind"><option value="habit">반복 목표</option><option value="project">장기 목표 · 프로젝트</option></select></label><div id="new-habit-fields"><label class="form-field">반복 주기<select name="cadence">${C.CYCLES.map(c=>`<option value="${c}">${C.LABELS[c]}</option>`).join('')}</select></label><div class="grid2"><label class="form-field">목표량<input name="target" type="number" inputmode="decimal" min="0.0001" max="1000000000000" step="any" value="1" required></label><label class="form-field">단위<input name="unit" maxlength="20" value="회" required></label></div><label class="form-field">기준<select name="mode"><option value="atleast">목표 이상 하기</option><option value="atmost">상한 이하로 유지</option></select></label></div><label class="form-field">시작일<input name="start" type="date" value="${C.localToday()}" min="2000-01-01" max="${C.localToday()}" required></label><button type="submit" class="primary">목표 추가</button></form>`);}
function pinsModal(){showModal('오늘 볼 반복 목표',`<p class="note">일간 목표는 기본으로 표시돼요. 다른 주기에서 최대 3개를 선택하세요.</p><form id="pins-form">${habitList().filter(g=>g.cadence!=='daily').map(g=>`<label class="inline-check"><input type="checkbox" name="pin" value="${g.id}" ${g.pinned?'checked':''}><span>${esc(g.title)} <small class="small">${C.LABELS[g.cadence]}</small></span></label>`).join('')}<button class="primary" type="submit">선택 저장</button></form>`);}
let pendingRestore=null;
function extraAction(action,b){
 if(action==='pins')pinsModal();else if(action==='add-goal')addGoalModal();else if(action==='back-domain'){const g=goal(state.goal);state.domain=C.SEED.findIndex(d=>d.name===g?.domain);state.goal=null;if(state.domain<0)state.domain=null;render();}
 else if(action==='back-stats'){state.statsGoal=null;render();}
 else if(action==='archived'){showModal('보관한 목표',db.goals.filter(g=>g.archivedAt).map(g=>`<button class="stats-row" data-restore-goal="${g.id}"><span class="row-copy"><strong>${esc(g.title)}</strong><small>${esc(g.domain)}</small></span><span class="text-blue">해제</span></button>`).join('')||empty('보관한 목표가 없어요.','보관해도 과거 기록은 유지돼요.'));}
 else if(action==='confirm-archive'){const id=b.dataset.id;if(commit(next=>{C.archiveGoal(next.goals.find(g=>g.id===id));},'목표를 보관했어요.'))modal.close();}
 else if(action==='confirm-restore'&&pendingRestore){const imported=pendingRestore;try{if(lastRaw)localStorage.setItem(KEY+'-before-restore',lastRaw);const wasBlocked=blocked;blocked=false;try{persist(imported);}catch(error){blocked=wasBlocked;throw error;}undo=null;pendingRestore=null;modal.close();state.view='today';state.goal=null;state.domain=null;state.statsGoal=null;$('#storage-warning').hidden=true;render();notify('백업을 복원했어요.');}catch(e){warn('복원하지 못했어요. 기존 기록은 유지돼요.');notify(e.message);}}
 else if(action==='recover-previous'){try{const raw=localStorage.getItem(KEY+'-before-restore');if(!raw)throw Error('복원 전 백업이 없어요.');prepareRestore(C.validateDB(JSON.parse(raw)));}catch(e){notify(e.message);}}
}
function extraSubmit(e){const f=e.target,id=f.dataset.project;let success=false;
 if(f.id==='project-form'){e.preventDefault();success=commit(next=>{const g=next.goals.find(x=>x.id===id);g.status=f.elements.status.value;g.nextAction=f.elements.nextAction.value.trim();g.due=f.elements.due.value;if(g.unit){g.current=f.elements.current.value===''?null:Number(f.elements.current.value);const target=Number(f.elements.target.value);if(target<=0||!Number.isFinite(target))throw Error('목표량을 확인해 주세요.');g.revisions=[{from:g.start,target}];}},'다음 행동을 저장했어요.');}
 else if(f.id==='milestone-form'){e.preventDefault();const title=f.elements.title.value.trim();if(!title)return;commit(next=>{const g=next.goals.find(x=>x.id===id);if(g.milestones.length>=100)throw Error('단계는 100개까지 추가할 수 있어요.');g.milestones.push({id:uid(),title,done:false});},'단계를 추가했어요.');}
 else if(f.id==='pins-form'){e.preventDefault();const pins=Array.from(f.querySelectorAll('input:checked')).map(x=>x.value);if(pins.length>3){$('#form-error').textContent='최대 3개까지 선택해 주세요.';$('#form-error').hidden=false;return;}success=commit(next=>next.goals.forEach(g=>g.pinned=pins.includes(g.id)),'오늘 볼 목표를 바꿨어요.');if(success)modal.close();}
 else if(f.id==='goal-settings-form'){e.preventDefault();const id=state.edit.id,title=f.elements.title.value.trim(),value=Number(f.elements.target.value);if(!title)return;success=commit(next=>{const g=next.goals.find(g=>g.id===id);g.title=title;if(g.revisions[g.revisions.length-1].target!==value)C.reviseTarget(g,value);},'목표 설정을 저장했어요.');if(success)modal.close();}
 else if(f.id==='add-goal-form'){e.preventDefault();const title=f.elements.title.value.trim(),kind=f.elements.kind.value,start=f.elements.start.value,id='custom_'+uid();if(!title)return;success=commit(next=>{next.goals.push({id,domain:f.elements.domain.value,title,description:'직접 추가한 목표',kind,cadence:kind==='habit'?f.elements.cadence.value:'monthly',unit:kind==='habit'?f.elements.unit.value.trim():'',mode:kind==='habit'?f.elements.mode.value:'atleast',start,archivedAt:null,revisions:[{from:start,target:kind==='habit'?Number(f.elements.target.value):1}],pinned:false,status:'notstarted',current:null,nextAction:'',due:'',milestones:[]});},'새 목표를 추가했어요.');if(success){modal.close();state.view='goals';state.goal=id;render();}}
}
function extraChange(e){if(e.target.id==='new-kind'){const fields=$('#new-habit-fields'),project=e.target.value==='project';fields.hidden=project;fields.querySelectorAll('input,select').forEach(el=>el.disabled=project);}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.editGoal)goalSettings(d.editGoal);
 else if(d.openStats){state.view='stats';state.statsGoal=d.openStats;state.detailPane='calendar';render();}
 else if(d.detailPane){state.detailPane=d.detailPane;render();}
 else if(d.archive){showModal('목표를 보관할까요?',`<p class="note">${esc(goal(d.archive).title)}은 오늘과 주기별 목록에서 숨겨져요. 과거 기록은 유지되고, 보관 기간은 달성률 계산에서 빠져요.</p><button class="danger-button" data-action="confirm-archive" data-id="${d.archive}">보관하기</button>`);}
 else if(d.unarchive||d.restoreGoal){const id=d.unarchive||d.restoreGoal;commit(next=>C.unarchiveGoal(next.goals.find(g=>g.id===id)),'보관을 해제했어요.');if(modal.open)modal.close();}
 else if(d.milestone){commit(next=>{const m=next.goals.find(g=>g.id===d.parent).milestones.find(m=>m.id===d.milestone);m.done=!m.done;},'진행 단계를 바꿨어요.');}
 else if(d.removeMilestone){commit(next=>{const g=next.goals.find(g=>g.id===d.parent);g.milestones=g.milestones.filter(m=>m.id!==d.removeMilestone);},'단계를 지웠어요.');}
});
function prepareRestore(candidate){pendingRestore=candidate;showModal('백업 내용 확인',`<p class="note">현재 기록을 이 백업으로 교체해요. 먼저 현재 기록을 내려받아 두세요.</p><section class="card" style="background:var(--bg)"><strong>목표 ${candidate.goals.length}개 · 기록 ${Object.keys(candidate.records).length}개</strong><p class="small">저장 시점: ${esc(candidate.updatedAt.slice(0,19).replace('T',' '))}</p></section><button class="secondary" data-action="export">현재 기록 먼저 백업</button><button class="primary" data-action="confirm-restore">이 백업으로 복원</button>`);}
$('#backup-input').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>8*1024*1024)throw Error('8MB 이하의 백업 파일을 선택해 주세요.');const candidate=C.validateDB(JSON.parse(await file.text()));prepareRestore(candidate);}catch(error){notify(error instanceof SyntaxError?'올바른 JSON 백업 파일이 아니에요. 기존 기록은 유지돼요.':error.message);}});
try{const context=document.modelContext;if(context?.registerTool){const lifecycle=new AbortController();const registration=context.registerTool({name:'read_goal_tracker',title:'목표 기록 확인',description:'현재 화면과 같은 기기 내 목표, 선택 날짜의 기록을 읽습니다. 기록을 변경하지 않습니다.',inputSchema:{type:'object',properties:{date:{type:'string',description:'YYYY-MM-DD'}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){const date=input?.date||C.localToday();if(!C.validDate(date))throw Error('Invalid date');return {date,goals:db.goals.filter(g=>!g.archivedAt).map(g=>({id:g.id,title:g.title,kind:g.kind,...(g.kind==='habit'?{cadence:g.cadence,...C.progress(db,g,date)}:{status:g.status,nextAction:g.nextAction,due:g.due})}))};}},{signal:lifecycle.signal});Promise.resolve(registration).catch(()=>{});window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});}}catch{}
render();
})();
</script>
</body>
</html>
